```html
<!DOCTYPE html>
<html>
<head>

    <title>Student Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <form action="/register" method="POST">

        <label>Name</label>
        <input type="text"
               name="name"
               placeholder="Enter your name"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label>Course</label>
        <input type="text"
               name="course"
               placeholder="Enter your course"
               required>

        <label>Phone</label>
        <input type="tel"
               name="phone"
               placeholder="Enter phone number"
               required>

        <button type="submit">
            Register Student
        </button>

    </form>

</div>

</body>
</html>
```
